<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Twinsies">
  <!-- Family tile: 22.44% radius, accent fill, white filled glyph — the abacus/bird convention.
       #007AC3 is Wolters Kluwer's brand blue, the house Twinfield is sold under. -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#007AC3"/>
  <!-- Two identical sheets, one offset behind the other: the order in Craft and the document in
       Twinfield, the same thing twice. The back sheet is cut away around the front one rather than
       drawn underneath it, so the pair survives as one colour in icon-mask.svg. The punched lines
       are what stop it reading as the generic "copy" glyph. -->
  <g fill="#FEFEFE" fill-rule="evenodd">
    <path d="M23 12H53A7 7 0 0 1 60 19V27H47A12 12 0 0 0 35 39V68H23A7 7 0 0 1 16 61V19A7 7 0 0 1 23 12ZM23 18h29v5h-29Z"/>
    <path d="M47 32H77A7 7 0 0 1 84 39V81A7 7 0 0 1 77 88H47A7 7 0 0 1 40 81V39A7 7 0 0 1 47 32ZM48 42h28v5h-28ZM48 53h28v5h-28ZM48 64h18v5h-18ZM48 75h24v5h-24Z"/>
  </g>
</svg>
