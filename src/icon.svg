<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Twinsies">
    <!-- Two identical sheets, one behind the other: what Twinsies keeps true — the order in
         Craft and the document in Twinfield are the same thing, twice. -->
    <g transform="rotate(-7 50 50)">
        <rect x="16" y="14" width="50" height="64" rx="6" fill="#9EC6EC"/>
    </g>
    <g transform="rotate(6 50 50)">
        <rect x="34" y="22" width="50" height="64" rx="6" fill="#1B5FA8"/>
        <rect x="43" y="35" width="32" height="5" rx="2.5" fill="#FFFFFF" opacity="0.92"/>
        <rect x="43" y="47" width="32" height="5" rx="2.5" fill="#FFFFFF" opacity="0.7"/>
        <rect x="43" y="59" width="20" height="5" rx="2.5" fill="#FFFFFF" opacity="0.7"/>
        <rect x="43" y="71" width="26" height="5" rx="2.5" fill="#F0A22E"/>
    </g>
</svg>
